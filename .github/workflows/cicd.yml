name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier@3.9.1 prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # ============================================================
  # Job 2 -- Blockchain (Smart Contract) Compile & Test
  # ============================================================
  blockchain_tests:
    name: Blockchain Compile & Test
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: code/blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run contract test suite
        run: npm test

  # =====================================================================
  # Job 3 -- Backend Test & Build (Pytest + Docker images + smoke test)
  # =====================================================================
  backend_test_build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (ML=false)
        uses: docker/build-push-action@v6
        with:
          context: code
          file: code/backend/Dockerfile
          target: runtime
          push: false
          load: true
          tags: chainfinity-backend:ci-false
          build-args: |
            INSTALL_ML=false
          cache-from: type=gha,scope=backend-ml-false
          cache-to: type=gha,mode=max,scope=backend-ml-false

      - name: Build backend image (ML=true)
        uses: docker/build-push-action@v6
        with:
          context: code
          file: code/backend/Dockerfile
          target: runtime
          push: false
          load: true
          tags: chainfinity-backend:ci-true
          build-args: |
            INSTALL_ML=true
          cache-from: type=gha,scope=backend-ml-true
          cache-to: type=gha,mode=max,scope=backend-ml-true

      - name: Smoke test image contents
        run: |
          set -euo pipefail
          cat > /tmp/smoke_test.py <<'PY'
          import os

          import app.main
          from services.ai import get_ai_service

          status = get_ai_service().status()
          assert status["package_available"], status
          assert str(status["tensorflow_available"]).lower() == os.environ["EXPECT_TF"], status
          assert status["models"]["liquidity"]["loaded"], status
          print("backend image OK:", status["tensorflow_available"])
          PY

          failed=0
          for ml in false true; do
            echo "=== Smoke testing image (ML=${ml}) ==="
            if ! docker run --rm -i \
              -e EXPECT_TF="${ml}" \
              --entrypoint python \
              "chainfinity-backend:ci-${ml}" - < /tmp/smoke_test.py; then
              echo "Smoke test failed for ML=${ml}" >&2
              failed=1
            fi
          done
          exit "${failed}"

  # ============================================================
  # Job 4 -- AI Models Test & Validation (Pytest + coverage)
  # ============================================================
  ai_models_test:
    name: AI Models Test & Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      AI_MODELS_DIR: code/ai_models
      # ai_models is imported as a top-level package, so code/ must be on the path.
      PYTHONPATH: ${{ github.workspace }}/code
      # Keep TensorFlow quiet and make sure nothing tries to use a GPU on the runner.
      TF_CPP_MIN_LOG_LEVEL: "2"
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            code/ai_models/requirements.txt
            code/ai_models/requirements-ml.txt

      # TensorFlow is optional for the package, but it is installed here so the
      # LSTM models and the keras artifact round trips are tested as well.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r "${AI_MODELS_DIR}/requirements.txt"
          python -m pip install -r "${AI_MODELS_DIR}/requirements-ml.txt"
          python -m pip install pytest pytest-cov

      - name: Byte-compile all ai_models sources
        run: |
          set -euo pipefail
          echo "=== Compiling core, preprocessing, models and tests ==="
          python -m compileall -q "${AI_MODELS_DIR}"

      - name: Verify public API and sub-packages import cleanly
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib

          import ai_models

          for name in ai_models.__all__:
              getattr(ai_models, name)
              print(f"OK   ai_models.{name}")

          for module in (
              "core.compat",
              "core.persistence",
              "core.registry",
              "preprocessing.ohlcv",
              "models.volatility",
              "models.correlation",
              "models.exploit",
              "models.liquidity",
              "models.smart_money",
          ):
              importlib.import_module(f"ai_models.{module}")
              print(f"OK   ai_models.{module}")
          print(f"ai_models {ai_models.__version__} imports cleanly")
          PY

      - name: Run ai_models test suite
        working-directory: ${{ env.AI_MODELS_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --cov=ai_models \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml

      - name: Upload ai_models coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-models-coverage-report
          path: code/ai_models/coverage.xml
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # Job 5 -- Web Frontend Test & Build
  # ============================================================
  web-frontend_test_and_build:
    name: Web-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: CI=true npm test

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 6 -- Mobile Frontend (Expo) Test & Build
  # ============================================================
  mobile_frontend:
    name: Mobile-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: mobile-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Mobile Tests
        run: npm run test:ci

      - name: Build Mobile Web Export
        run: CI=false npm run build:web

      - name: Upload Mobile Web Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: mobile-frontend/dist/
          retention-days: 7
