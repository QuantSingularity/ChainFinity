name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier@3.9.1 prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # ============================================================
  # Job 2 -- Blockchain (Smart Contract) Compile & Test
  # ============================================================
  blockchain_tests:
    name: Blockchain Compile & Test
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: code/blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run contract test suite
        run: npm test

  # =====================================================================
  # Job 3 -- Backend Test & Build (Pytest + Docker images + smoke test)
  # =====================================================================
  backend_test_build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (ML=false)
        uses: docker/build-push-action@v6
        with:
          context: code
          file: code/backend/Dockerfile
          target: runtime
          push: false
          load: true
          tags: chainfinity-backend:ci-false
          build-args: |
            INSTALL_ML=false
          cache-from: type=gha,scope=backend-ml-false
          cache-to: type=gha,mode=max,scope=backend-ml-false

      - name: Build backend image (ML=true)
        uses: docker/build-push-action@v6
        with:
          context: code
          file: code/backend/Dockerfile
          target: runtime
          push: false
          load: true
          tags: chainfinity-backend:ci-true
          build-args: |
            INSTALL_ML=true
          cache-from: type=gha,scope=backend-ml-true
          cache-to: type=gha,mode=max,scope=backend-ml-true

      - name: Smoke test image contents
        run: |
          set -euo pipefail
          cat > /tmp/smoke_test.py <<'PY'
          import os

          import app.main
          from services.ai import get_ai_service

          status = get_ai_service().status()
          assert status["package_available"], status
          assert str(status["tensorflow_available"]).lower() == os.environ["EXPECT_TF"], status
          assert status["models"]["liquidity"]["loaded"], status
          print("backend image OK:", status["tensorflow_available"])
          PY

          failed=0
          for ml in false true; do
            echo "=== Smoke testing image (ML=${ml}) ==="
            if ! docker run --rm -i \
              -e EXPECT_TF="${ml}" \
              --entrypoint python \
              "chainfinity-backend:ci-${ml}" - < /tmp/smoke_test.py; then
              echo "Smoke test failed for ML=${ml}" >&2
              failed=1
            fi
          done
          exit "${failed}"

  # ============================================================
  # Job 4 -- AI Models Test & Validation (Pytest + coverage)
  # ============================================================
  ai_models_test:
    name: AI Models Test & Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      AI_MODELS_DIR: code/ai_models
      # ai_models is imported as a top-level package, so code/ must be on the path.
      PYTHONPATH: ${{ github.workspace }}/code
      # Keep TensorFlow quiet and make sure nothing tries to use a GPU on the runner.
      TF_CPP_MIN_LOG_LEVEL: "2"
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            code/ai_models/requirements.txt
            code/ai_models/requirements-ml.txt

      # TensorFlow is optional for the package, but it is installed here so the
      # LSTM models and the keras artifact round trips are tested as well.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r "${AI_MODELS_DIR}/requirements.txt"
          python -m pip install -r "${AI_MODELS_DIR}/requirements-ml.txt"
          python -m pip install pytest pytest-cov

      - name: Byte-compile all ai_models sources
        run: |
          set -euo pipefail
          echo "=== Compiling core, preprocessing, models and tests ==="
          python -m compileall -q "${AI_MODELS_DIR}"

      - name: Verify public API and sub-packages import cleanly
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib

          import ai_models

          for name in ai_models.__all__:
              getattr(ai_models, name)
              print(f"OK   ai_models.{name}")

          for module in (
              "core.compat",
              "core.persistence",
              "core.registry",
              "preprocessing.ohlcv",
              "models.volatility",
              "models.correlation",
              "models.exploit",
              "models.liquidity",
              "models.smart_money",
          ):
              importlib.import_module(f"ai_models.{module}")
              print(f"OK   ai_models.{module}")
          print(f"ai_models {ai_models.__version__} imports cleanly")
          PY

      - name: Run ai_models test suite
        working-directory: ${{ env.AI_MODELS_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --cov=ai_models \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml

      - name: Upload ai_models coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-models-coverage-report
          path: code/ai_models/coverage.xml
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # Job 5 -- Web Frontend Test & Build
  # ============================================================
  web-frontend_test_and_build:
    name: Web-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: CI=true npm test

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 6 -- Mobile Frontend (Expo) Test & Build
  # ============================================================
  mobile_frontend:
    name: Mobile-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: mobile-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Mobile Tests
        run: npm run test:ci

      - name: Build Mobile Web Export
        run: CI=false npm run build:web

      - name: Upload Mobile Web Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: mobile-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 7 -- Docs Validation
  # ============================================================
  docs_validation:
    name: Docs Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint Markdown (docs/ and root README)
        run: |
          set -euo pipefail
          # Line length is left to Prettier (code_quality job); inline HTML is allowed
          # for the badges/images in the README; repeated headings are fine under
          # different parents (for example "Via API" in several sections).
          cat > "$RUNNER_TEMP/markdownlint.jsonc" <<'EOF'
          {
            "config": {
              "default": true,
              "MD013": false,
              "MD024": { "siblings_only": true },
              "MD033": {
                "allowed_elements": ["img", "div", "p", "br", "a", "picture", "source", "details", "summary"]
              }
            }
          }
          EOF
          npx --yes markdownlint-cli2@0.24.0 --config "$RUNNER_TEMP/markdownlint.jsonc" "docs/**/*.md" README.md

      - name: Install lychee (link checker)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin" --strip-components=1 --wildcards '*/lychee'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check internal links and anchors
        run: |
          lychee --offline --no-progress --include-fragments \
            'docs/**/*.md' README.md scripts/README.md infrastructure/README.md .github/readme/README.md

      - name: Validate code samples (python, bash, json)
        run: |
          python - <<'PY'
          import ast, json, pathlib, re, subprocess, sys

          FENCE = re.compile(r"^```([A-Za-z0-9_+-]*)[^\n]*\n(.*?)^```", re.S | re.M)
          failures = checked = 0
          files = sorted(pathlib.Path("docs").rglob("*.md")) + [pathlib.Path("README.md")]
          for path in files:
              text = path.read_text(encoding="utf-8")
              for m in FENCE.finditer(text):
                  lang, body = m.group(1).lower(), m.group(2)
                  line = text.count("\n", 0, m.start()) + 1
                  err = None
                  if lang in ("python", "py"):
                      try:
                          ast.parse(body)
                      except SyntaxError as e:
                          err = f"python: {e.msg} (block line {e.lineno})"
                  elif lang in ("bash", "sh", "shell"):
                      r = subprocess.run(["bash", "-n"], input=body, text=True, capture_output=True)
                      if r.returncode:
                          err = "bash: " + r.stderr.strip().splitlines()[-1]
                  elif lang == "json":
                      try:
                          json.loads(body)
                      except ValueError as e:
                          err = f"json: {e}"
                  else:
                      continue
                  checked += 1
                  if err:
                      failures += 1
                      print(f"::error file={path},line={line}::{err}")
          print(f"Checked {checked} code blocks, {failures} invalid")
          sys.exit(1 if failures else 0)
          PY

      - name: Check docs are consistent with the repository
        run: |
          set -euo pipefail
          status=0

          # Every script in scripts/ must be documented in docs/CLI.md, and vice versa.
          scripts=$(for f in scripts/*.sh; do basename "$f"; done | sort)
          # shellcheck disable=SC2016  # the backticks are literal Markdown code spans
          documented=$(grep -oE '`[A-Za-z0-9_-]+\.sh`' docs/CLI.md | tr -d '`' | sort -u)
          for s in $(comm -23 <(echo "$scripts") <(echo "$documented")); do
            echo "::error file=docs/CLI.md::scripts/$s exists but is not documented in docs/CLI.md"; status=1
          done
          for s in $(comm -13 <(echo "$scripts") <(echo "$documented")); do
            echo "::error file=docs/CLI.md::docs/CLI.md documents $s but scripts/$s does not exist"; status=1
          done

          # Every page in docs/ must be reachable from the docs index.
          for f in docs/*.md docs/examples/*.md; do
            name=${f#docs/}
            [ "$name" = "README.md" ] && continue
            grep -q "($name)\|(./$name)" docs/README.md || { echo "::error file=$f::not linked from docs/README.md"; status=1; }
          done

          # Large binaries bloat clones; warn only.
          while IFS= read -r big; do
            echo "::warning file=$big::file is larger than 5 MB; consider compressing it (e.g. PNG/WebP instead of BMP)"
          done < <(find docs -type f -size +5M)

          exit "$status"

      - name: Check external links (advisory)
        continue-on-error: true
        run: |
          lychee --no-progress --max-retries 2 --timeout 20 --accept '200..=299,429' \
            'docs/**/*.md' README.md

  # ============================================================
  # Job 8 -- Infrastructure Validation
  # (Terraform, Kubernetes, Ansible, configs, Docker, secrets)
  # ============================================================
  infrastructure_validation:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      KUBERNETES_VERSION: "1.28.0"
      KUBECONFORM_VERSION: "0.8.0"
      HADOLINT_VERSION: "2.15.1"
      PROMETHEUS_VERSION: "3.15.1"
      ALERTMANAGER_VERSION: "0.34.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infrastructure/requirements-ci.txt

      - name: Install CI tooling (pinned in infrastructure/requirements-ci.txt)
        run: python -m pip install -r infrastructure/requirements-ci.txt

      # ---- Terraform ----------------------------------------
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: false

      - name: Terraform format check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend)
        working-directory: infrastructure/terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.65.0

      - name: TFLint (fails on errors, prints warnings)
        working-directory: infrastructure/terraform
        run: tflint --minimum-failure-severity=error

      # ---- Validation tools ---------------------------------
      - name: Install kubeconform, promtool, amtool and hadolint
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" kubeconform
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" --strip-components=1 --wildcards '*/promtool'
          curl -fsSL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" --strip-components=1 --wildcards '*/amtool'
          curl -fsSL -o "$HOME/.local/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          chmod +x "$HOME/.local/bin/hadolint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ---- Kubernetes ---------------------------------------
      # Validated offline, so no cluster is needed (kubectl --dry-run needs an API server).
      # compliance/ holds a custom configuration document, not Kubernetes manifests.
      # A skipped resource means kubeconform had no schema for it, which is how removed
      # APIs (such as PodSecurityPolicy) would slip through, so any skip fails the step.
      - name: Validate Kubernetes manifests
        working-directory: infrastructure
        run: |
          set -euo pipefail
          mapfile -t files < <(find kubernetes security -name '*.yaml' ! -path 'security/compliance/*' | sort)
          kubeconform -kubernetes-version "$KUBERNETES_VERSION" -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "${files[@]}" | tee "$RUNNER_TEMP/kubeconform.txt"
          grep -q 'Skipped: 0' "$RUNNER_TEMP/kubeconform.txt" || { echo "::error::kubeconform skipped resources without a schema (removed or unknown API?)"; exit 1; }

      # The same Namespace is defined in several files. kubectl apply tracks one object, so
      # differing Pod Security labels would flip back and forth depending on apply order.
      - name: Check Pod Security labels are consistent across Namespace definitions
        working-directory: infrastructure
        run: |
          python - <<'PY'
          import collections, glob, sys, yaml

          seen = collections.defaultdict(list)
          paths = glob.glob("kubernetes/**/*.yaml", recursive=True) + glob.glob("security/**/*.yaml", recursive=True)
          for path in sorted(paths):
              if path.startswith("security/compliance/"):
                  continue
              with open(path) as f:
                  for doc in yaml.safe_load_all(f):
                      if doc and doc.get("kind") == "Namespace":
                          labels = doc["metadata"].get("labels") or {}
                          psa = {k: v for k, v in labels.items() if k.startswith("pod-security.kubernetes.io/")}
                          seen[doc["metadata"]["name"]].append((path, psa))
          bad = 0
          for name, defs in seen.items():
              first_path, first = defs[0]
              for path, psa in defs[1:]:
                  if psa != first:
                      print(f"::error file=infrastructure/{path}::Namespace {name}: Pod Security labels {psa} differ from {first_path} ({first})")
                      bad += 1
          print(f"{len(seen)} namespaces checked, {bad} inconsistent definition(s)")
          sys.exit(1 if bad else 0)
          PY

      # ---- Ansible ------------------------------------------
      - name: Install Ansible collections
        working-directory: infrastructure/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible syntax check
        working-directory: infrastructure/ansible
        run: ansible-playbook -i inventory.ini --syntax-check playbook.yml

      - name: ansible-lint (content must load; full style rules are not enforced)
        working-directory: infrastructure/ansible
        run: ansible-lint --offline --profile min .

      - name: Install nginx (for configuration tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx openssl

      # `nginx -t -c` cannot check a site fragment on its own (it is not a full config), and
      # limit_req_zone is only legal at http level, so both configs are tested the way they
      # are used: the Ansible site enabled in sites-enabled, and the image config in http {}.
      - name: Validate nginx configurations
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/render-nginx.yml" <<'EOF'
          - hosts: localhost
            connection: local
            gather_facts: true
            tasks:
              - ansible.builtin.template:
                  src: "{{ template_src }}"
                  dest: "{{ template_dest }}"
                  mode: "0644"
          EOF
          ansible-playbook -i localhost, "$RUNNER_TEMP/render-nginx.yml" \
            -e "template_src=$PWD/infrastructure/ansible/templates/nginx.conf.j2" \
            -e "template_dest=$RUNNER_TEMP/chainfinity-site.conf"
          sudo mkdir -p /etc/ssl/chainfinity
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci" \
            -keyout /etc/ssl/chainfinity/privkey.pem -out /etc/ssl/chainfinity/fullchain.pem
          sudo ln -sf "$RUNNER_TEMP/chainfinity-site.conf" /etc/nginx/sites-enabled/chainfinity
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          printf 'events {}\nhttp {\n    include %s;\n}\n' "$PWD/infrastructure/docker/nginx-frontend.conf" > "$RUNNER_TEMP/frontend-wrapper.conf"
          sudo nginx -t -c "$RUNNER_TEMP/frontend-wrapper.conf"

      # ---- Service configuration ----------------------------
      - name: Validate Prometheus, Alertmanager, SQL and Vault configuration
        working-directory: infrastructure
        run: |
          set -euo pipefail
          promtool check config docker/prometheus/prometheus.yml
          amtool check-config docker/alertmanager/alertmanager.yml
          python - <<'PY'
          import glob, sys

          import hcl2
          import pglast

          bad = 0
          try:
              count = len(pglast.parse_sql(open("docker/postgres/init.sql").read()))
              print(f"docker/postgres/init.sql: {count} statements parsed")
          except Exception as exc:
              print(f"::error file=infrastructure/docker/postgres/init.sql::{exc}")
              bad += 1
          for path in sorted(glob.glob("security/vault/**/*.hcl", recursive=True)):
              try:
                  with open(path) as f:
                      hcl2.load(f)
                  print(f"{path}: valid HCL")
              except Exception as exc:
                  print(f"::error file=infrastructure/{path}::invalid HCL: {str(exc)[:200]}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: yamllint (Kubernetes, security, Ansible, Docker configs)
        working-directory: infrastructure
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, truthy: disable}}" \
            kubernetes security ansible docker docker-compose.yml

      # ---- Docker -------------------------------------------
      - name: Validate Docker Compose file
        working-directory: infrastructure
        run: docker compose --env-file .env.example config --quiet

      - name: Lint Dockerfiles (fails on errors, prints warnings)
        run: |
          hadolint --failure-threshold error \
            infrastructure/docker/Dockerfile.backend \
            infrastructure/docker/Dockerfile.blockchain \
            infrastructure/docker/Dockerfile.frontend

      # Compose and CI build these images with the repository root as context.
      - name: Check Dockerfile COPY sources exist in the build context
        run: |
          python - <<'PY'
          import glob, os, re, shlex, sys

          bad = 0
          dockerfiles = sorted(glob.glob("infrastructure/docker/Dockerfile.*"))
          for df in dockerfiles:
              text = open(df).read().replace("\\\n", " ")
              for line in text.split("\n"):
                  m = re.match(r"\s*(COPY|ADD)\s+(.*)", line, re.I)
                  if not m:
                      continue
                  parts = shlex.split(m.group(2))
                  flags = [p for p in parts if p.startswith("--")]
                  args = [p for p in parts if not p.startswith("--")]
                  if any(f.startswith("--from") for f in flags) or len(args) < 2:
                      continue
                  for src in args[:-1]:
                      if not re.match(r"https?://", src) and not glob.glob(src):
                          print(f"::error file={df}::{m.group(1)} source '{src}' does not exist in the build context (repository root)")
                          bad += 1
          print(f"{len(dockerfiles)} Dockerfiles checked, {bad} missing source(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The "Backend Test & Build" job builds code/backend/Dockerfile; these are the
      # images that Compose and Kubernetes actually run.
      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.frontend
          push: false
          tags: chainfinity/frontend:ci-${{ github.sha }}
          cache-from: type=gha,scope=infra-frontend
          cache-to: type=gha,mode=max,scope=infra-frontend

      - name: Build blockchain Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.blockchain
          push: false
          tags: chainfinity/blockchain:ci-${{ github.sha }}
          cache-from: type=gha,scope=infra-blockchain
          cache-to: type=gha,mode=max,scope=infra-blockchain

      # INSTALL_ML=false skips the large ML stack; the dependency set it needs
      # is covered by the AI Models job.
      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend
          build-args: INSTALL_ML=false
          push: false
          tags: chainfinity/backend:ci-${{ github.sha }}
          cache-from: type=gha,scope=infra-backend
          cache-to: type=gha,mode=max,scope=infra-backend

      # ---- Secrets ------------------------------------------
      # Template references ({{ }}, ${...}, $(...)) and obvious placeholders are not secrets.
      - name: Scan infrastructure for hard-coded secrets
        working-directory: infrastructure
        run: |
          set -uo pipefail
          found=0
          for pattern in 'password\s*=\s*"[^"]{8,}"' 'secret\s*=\s*"[^"]{8,}"' 'api[_-]key\s*=\s*"[^"]{8,}"' 'BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY'; do
            hits=$(grep -rEIin --exclude='*.md' "$pattern" terraform kubernetes ansible security docker \
              | grep -v '\.example' \
              | grep -viE 'placeholder|change_?me|:[0-9]+:\s*#' \
              | grep -vE '="(\{\{|\$\{|\$\()' || true)
            if [ -n "$hits" ]; then
              echo "::error::possible hard-coded secret matching /$pattern/"
              echo "$hits"
              found=1
            fi
          done
          exit "$found"

  # ============================================================
  # Job 9 -- Scripts Validation
  # ============================================================
  scripts_validation:
    name: Scripts Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ShellCheck
        run: python -m pip install shellcheck-py==0.11.0.1

      - name: ShellCheck all tracked shell scripts (fails on warnings and errors)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

      - name: ShellCheck stricter style findings (advisory)
        continue-on-error: true
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=info

      - name: Check syntax and shebang of all tracked shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
            head -n 1 "$f" | grep -qE '^#!.*(bash|sh)' || { echo "::error file=$f::missing shebang"; exit 1; }
          done < <(git ls-files -z '*.sh')

      - name: Check shell scripts are executable in git
        run: |
          missing=$(git ls-files -s '*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$missing" ]; then
            while IFS= read -r f; do
              echo "::error file=$f::not executable in git. Fix: git update-index --chmod=+x $f"
            done <<< "$missing"
            exit 1
          fi

      # Only scripts with a real --help handler are listed: the others
      # (run_chainfinity.sh, cleanup_chainfinity.sh, lint-all.sh, ...) do not treat
      # --help as a request for usage and would act instead.
      - name: Smoke test --help on CLI scripts
        run: |
          set -uo pipefail
          status=0
          before=$(git status --porcelain)
          for s in deploy_chainfinity env_setup monitor_chainfinity test_chainfinity; do
            if out=$(timeout 30 bash "scripts/$s.sh" --help </dev/null 2>&1) && grep -qi 'usage' <<< "$out"; then
              echo "OK   $s.sh --help"
            else
              echo "::error file=scripts/$s.sh::--help did not exit 0 with a usage message"
              status=1
            fi
          done
          after=$(git status --porcelain)
          if [ "$before" != "$after" ]; then
            echo "::error::--help modified the working tree:"; git status --porcelain; status=1
          fi
          exit "$status"
