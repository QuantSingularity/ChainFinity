[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainfinity-ai-models"
version = "2.0.0"
description = "Risk and market intelligence models for the ChainFinity platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
ml = ["tensorflow-cpu>=2.15,<2.19"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
chainfinity-ai = "ai_models.cli:main"

[tool.setuptools]
package-dir = { "ai_models" = "." }
packages = [
    "ai_models",
    "ai_models.core",
    "ai_models.preprocessing",
    "ai_models.models",
    "ai_models.models.volatility",
    "ai_models.models.correlation",
    "ai_models.models.exploit",
    "ai_models.models.liquidity",
    "ai_models.models.smart_money",
]

[tool.setuptools.package-data]
ai_models = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests"]
